<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Way2Go — Navigate campus your way.</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/auth.css" />
<link rel="stylesheet" href="css/live.css" />
<link rel="stylesheet" href="css/ai.css" />
</head>
<body>
  <a class="skip-link" href="#panel">Skip to route planner</a>

  <div id="map" aria-label="Campus map"></div>

  <div class="top-bar">
    <div id="auth-slot"></div>
  </div>

  <main id="panel" class="panel" aria-label="Route planner">
    <button type="button" class="back-button" id="back-btn" hidden>
      <span class="back-button-arrow" aria-hidden="true">&larr;</span>
      <span class="back-button-label">Back</span>
    </button>

    <div class="sheet-handle-row">
      <button type="button" class="sheet-handle" id="sheet-expand-btn" aria-label="Resize panel">
        <span class="sheet-handle-grip" aria-hidden="true"></span>
      </button>
    </div>

    <div class="step-progress" id="step-progress" aria-hidden="true" hidden>
      <span class="progress-dot" data-step="1"></span>
      <span class="progress-dot" data-step="2"></span>
      <span class="progress-dot" data-step="3"></span>
      <span class="progress-dot" data-step="4"></span>
    </div>

    <div id="step-content"></div>

    <div class="panel-footer">
      <div class="text-size-control" role="group" aria-label="Text size">
        <button type="button" id="font-decrease" aria-label="Decrease text size">A&minus;</button>
        <button type="button" id="font-increase" aria-label="Increase text size">A+</button>
      </div>
    </div>
  </main>

  <div id="aria-live-region" class="visually-hidden" aria-live="polite"></div>

  <div class="attribution-bar">
    <span>Routes are guidance, not ADA certification.</span>
  </div>

  <div id="report-sheet" hidden></div>
  <div id="auth-dialog" hidden></div>
  <div id="facilities-panel" hidden></div>

  <template id="tpl-step-destination">
    <h1 class="step-question" id="step-heading" tabindex="-1">Where to?</h1>
    <div class="field">
      <span id="destination-label" class="visually-hidden">Destination building</span>
      <button
        type="button"
        class="picker-trigger"
        id="destination-picker-trigger"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-labelledby="destination-label destination-picker-text"
      >
        <span class="picker-trigger-text is-placeholder" id="destination-picker-text">Choose a building</span>
        <span class="picker-trigger-chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div id="destination-input" hidden></div>
      <div class="picker-panel" id="destination-picker-panel" aria-hidden="true">
        <ul
          class="picker-listbox"
          id="destination-picker-listbox"
          role="listbox"
          aria-label="Destination building"
          tabindex="-1"
        ></ul>
      </div>
    </div>
  </template>

  <template id="tpl-step-origin">
    <h1 class="step-question" id="step-heading" tabindex="-1">Starting from</h1>
    <div class="field">
      <span id="origin-label" class="visually-hidden">Starting building</span>
      <button
        type="button"
        class="picker-trigger"
        id="origin-picker-trigger"
        aria-haspopup="listbox"
        aria-expanded="false"
        aria-labelledby="origin-label origin-picker-text"
      >
        <span class="picker-trigger-text is-placeholder" id="origin-picker-text">Choose a building</span>
        <span class="picker-trigger-chevron" aria-hidden="true">&#9662;</span>
      </button>
      <div class="picker-panel" id="origin-picker-panel" aria-hidden="true">
        <ul
          class="picker-listbox"
          id="origin-picker-listbox"
          role="listbox"
          aria-label="Starting building"
          tabindex="-1"
        ></ul>
      </div>
    </div>
    <p class="field-hint" id="origin-error" role="alert" hidden></p>
  </template>

  <template id="tpl-step-chips">
    <h1 class="step-question" id="step-heading" tabindex="-1">Anything we should avoid?</h1>
    <button type="button" class="link-button" id="use-usual-prefs" hidden>Use my usual preferences</button>
    <div id="ai-slot" hidden></div>
    <div class="chip-grid" role="group" aria-label="Accessibility preferences">
      <button type="button" class="pill-chip" data-chip="avoid_stairs" aria-pressed="false">
        <span aria-hidden="true">♿</span> Avoid stairs <span class="chip-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="pill-chip" data-chip="avoid_steep" aria-pressed="false">
        <span aria-hidden="true">↗</span> Avoid steep slopes <span class="chip-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="pill-chip" data-chip="curb_cuts" aria-pressed="false">
        <span aria-hidden="true">⬇</span> Curb cuts at crossings <span class="chip-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="pill-chip" data-chip="accessible_entrance" aria-pressed="false">
        <span aria-hidden="true">🚪</span> Accessible entrances <span class="chip-check" aria-hidden="true">✓</span>
      </button>
      <button type="button" class="pill-chip" data-chip="well_lit" aria-pressed="false">
        <span aria-hidden="true">💡</span> Well-lit paths <span class="chip-check" aria-hidden="true">✓</span>
      </button>
    </div>
  </template>

  <template id="tpl-step-importance">
    <h1 class="step-question" id="step-heading" tabindex="-1">How much does each one matter?</h1>
    <div id="importance-list"></div>
  </template>

  <template id="tpl-importance-row">
    <div class="importance-row">
      <p class="importance-chip-label"></p>
      <div class="segmented-control" role="radiogroup">
        <label class="segment"><input type="radio" value="essential" /> Essential</label>
        <label class="segment"><input type="radio" value="important" /> Important</label>
        <label class="segment"><input type="radio" value="nice" /> Nice to have</label>
      </div>
    </div>
  </template>

  <template id="tpl-loading">
    <div class="loading-state">
      <span class="spinner" aria-hidden="true"></span>
      <p>Finding a route that works for you</p>
    </div>
  </template>

  <template id="tpl-error">
    <div class="error-state">
      <p id="error-message"></p>
      <button type="button" class="choice-button" id="error-retry-btn">Try again</button>
    </div>
  </template>

  <template id="tpl-results">
    <h1 class="step-question" id="step-heading" tabindex="-1">Recommended for you</h1>

    <div id="fit-banner" class="fit-banner" hidden role="status">
      <span class="fit-banner-icon" aria-hidden="true">&#9888;</span>
      <div class="fit-banner-body">
        <p>This route doesn't fully fit your preferences</p>
        <ul id="fit-reasons-list"></ul>
      </div>
    </div>

    <div class="headline-stat">
      <span class="headline-number" id="headline-minutes"></span>
      <span class="headline-label">min &middot; <span id="headline-distance"></span></span>
    </div>

    <dl class="stat-grid" id="summary-stats"></dl>

    <div id="conditions-slot" hidden></div>

    <div class="why-card">
      <h2>Why this route?</h2>
      <ul id="explanation-list-short"></ul>
      <button type="button" class="link-button" id="show-details-btn" aria-expanded="false">More details</button>
      <div id="explanation-details" hidden>
        <ul id="explanation-list-full"></ul>
        <h3>Segments</h3>
        <ul id="segment-list"></ul>
      </div>
    </div>

    <div class="segmented-control compare-control" role="radiogroup" aria-label="Compare routes" id="compare-control">
      <label class="segment"><input type="radio" name="compare" value="recommended" checked /> Recommended</label>
      <label class="segment"><input type="radio" name="compare" value="fastest" /> Fastest</label>
      <label class="segment"><input type="radio" name="compare" value="stepfree" /> Step-free</label>
    </div>
    <dl class="compare-stats" id="compare-stats"></dl>

    <div class="results-actions">
      <button type="button" class="choice-button" id="edit-preferences-btn">Edit preferences</button>
      <button type="button" class="choice-button" id="new-destination-btn">New destination</button>
    </div>
  </template>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>
  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
